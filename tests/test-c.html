<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사육 기록 티어 테스트 | 당신의 집사 등급은?</title>
<meta name="description" content="파충류 사육자를 위한 게임화 티어 테스트. 아이언부터 챌린저까지, 당신의 사육 기록력을 측정합니다.">
<script data-goatcounter="https://neli3307.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  :root{
    /* ===== ELDS design tokens ===== */
    --gray5:#F9FAFB;
    --gray10:#EEF0F2;
    --gray20:#E2E7EB;
    --gray50:#8B95A1;
    --gray60:#6B7684;
    --gray70:#4E5968;
    --gray90:#191F28;
    --white:#FFFFFF;
    --primary:#EEA759;
    --primary50:#F6D3AC;
    --primary10:#FDF5EC;
    --primary-light:rgba(238,167,89,.1);
    --success:#03B26C;
    --tag-orange:#FF7700;      --tag-orange-light:rgba(255,119,0,.1);
    --tag-mint:#00B29A;        --tag-mint-light:rgba(0,178,154,.1);
    --tag-blue:#168AFF;        --tag-blue-light:rgba(22,138,255,.1);
    --tag-purple:#9747FF;      --tag-purple-light:rgba(151,71,255,.1);
    --tag-yellow:#FAB107;      --tag-yellow-light:rgba(250,177,7,.1);
    --tag-gray:#576578;        --tag-gray-light:rgba(87,101,120,.1);
    --shadow-weak:0 2px 4px rgba(0,0,0,.20);
    --shadow-card:0 4px 8px rgba(0,0,0,.12);
    --shadow-strong:0 4px 20px rgba(0,0,0,.20);
    /* Round: ELDS 문서에 명시 스펙 없음 — Round 컴포넌트 계열 추정치(카드20/버튼pill/인풋12) */
    --radius-card:20px;
    --radius-btn:999px;
    --radius-input:12px;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",Roboto,sans-serif;
    background:var(--gray5);
    color:var(--gray90);
    min-height:100%;
    line-height:1.5;
    letter-spacing:-0.025em;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    padding:24px 20px 40px;
    display:flex;
    flex-direction:column;
  }
  .screen{ display:none; flex-direction:column; flex:1; animation:fadeIn .35s ease; }
  .screen.active{ display:flex; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  h1{ font-size:24px; font-weight:500; line-height:1.45; }
  h2{ font-size:20px; font-weight:600; line-height:1.45; }
  p{ color:var(--gray70); font-size:14px; line-height:1.7; font-weight:400; }
  small{ font-size:13px; line-height:1.5; color:var(--gray50); }

  .eyebrow{
    display:inline-block; font-size:13px; line-height:1.5; font-weight:600; color:var(--gray70);
    letter-spacing:.06em; text-transform:uppercase; margin-bottom:10px;
  }

  .btn{
    appearance:none; border:none; cursor:pointer;
    border-radius:var(--radius-btn); padding:16px 20px; font-size:16px; font-weight:600; line-height:1.4;
    font-family:inherit; width:100%;
    transition:transform .15s ease, opacity .15s ease, background .15s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{
    background:var(--primary);
    color:var(--gray90);
  }
  .btn-secondary{
    background:var(--white); color:var(--gray70); border:1.5px solid var(--gray20);
    font-size:14px;
  }
  .btn-ghost{
    background:transparent; color:var(--gray60); border:1.5px solid var(--gray20);
    font-size:14px;
  }
  .btn[disabled]{ opacity:.4; pointer-events:none; }

  /* ---------- intro ---------- */
  #screen-intro{ justify-content:flex-start; gap:20px; }
  .intro-hero{ text-align:center; padding:12px 0 4px; }
  .intro-hero h1{ margin-bottom:8px; }
  .intro-hero p{ font-size:14px; }

  .tier-preview{
    display:flex; gap:10px; overflow-x:auto; padding:14px 4px 6px;
    scrollbar-width:none;
  }
  .tier-preview::-webkit-scrollbar{ display:none; }
  .tier-preview-item{
    flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:6px;
    width:58px;
  }
  .mini-badge{
    width:40px; height:44px;
    clip-path:polygon(50% 0%, 100% 22%, 100% 62%, 50% 100%, 0% 62%, 0% 22%);
  }
  .tier-preview-item small{ font-size:11px; color:var(--gray50); white-space:nowrap; }
  .tier-preview-arrow{ align-self:center; color:var(--gray50); font-size:12px; }

  .intro-note{
    text-align:center; margin-top:28px; padding-top:16px; border-top:1px solid var(--gray20);
  }
  .intro-note small{ display:block; margin-top:4px; }

  /* ---------- quiz ---------- */
  #screen-quiz{ gap:28px; padding-bottom:100px; }
  .progress-wrap{ display:flex; align-items:center; gap:12px; }
  .quiz-back-chevron{
    flex:0 0 auto; width:34px; height:34px; display:flex; align-items:center; justify-content:center;
    font-size:22px; line-height:1; color:var(--gray70); border-radius:50%;
    transition:background .12s ease;
  }
  .quiz-back-chevron:active{ background:var(--gray10); }
  .segments{ flex:1; display:flex; gap:6px; }
  .segment{ flex:1; height:5px; border-radius:999px; background:var(--gray20); }
  .segment.filled{ background:var(--primary); }

  .q-card{ display:flex; flex-direction:column; gap:22px; }
  .q-head{ display:flex; flex-direction:column; gap:8px; }
  .q-tag{ font-size:13px; line-height:1.4; color:var(--gray50); font-weight:600; letter-spacing:.02em; }
  .q-title{ font-size:24px; font-weight:500; line-height:1.4; color:var(--gray90); }
  .q-sub{ font-size:14px; line-height:1.7; color:var(--gray70); font-weight:400; }

  .options{ display:flex; flex-direction:column; gap:10px; }
  .option{
    text-align:left; background:var(--white); border:1px solid var(--gray20);
    border-radius:var(--radius-card); padding:18px 20px; font-size:16px; line-height:1.5; color:var(--gray90);
    cursor:pointer; font-family:inherit; font-weight:600;
    transition:border-color .15s ease, transform .1s ease;
  }
  .option:active{ transform:scale(.98); }
  .option:hover{ background:var(--gray10); }
  .option.selected{
    border:2px solid var(--primary); background:var(--white);
  }

  .quiz-cta{
    position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center;
    padding:16px 20px calc(16px + env(safe-area-inset-bottom));
    pointer-events:none;
  }
  .quiz-cta::before{
    content:''; position:absolute; inset:0;
    background:linear-gradient(to top, var(--gray5) 55%, rgba(249,250,251,0));
  }
  .quiz-cta-inner{ position:relative; width:100%; max-width:480px; pointer-events:auto; }
  #btn-quiz-next:disabled{ background:var(--gray20); color:var(--gray50); opacity:1; pointer-events:none; }

  /* ---------- loading ---------- */
  #screen-loading{ align-items:center; justify-content:center; text-align:center; gap:18px; }
  .spinner{
    width:64px; height:64px; border-radius:50%;
    border:4px solid var(--gray20); border-top-color:var(--primary);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading-text{ font-size:16px; font-weight:600; color:var(--gray90); }
  .loading-dots::after{
    content:''; display:inline-block; width:1.2em; text-align:left;
    animation:dots 1.2s steps(4) infinite;
  }
  @keyframes dots{ 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} 100%{content:''} }

  /* ---------- result ---------- */
  #screen-result{ gap:18px; align-items:stretch; }
  .result-hero{ text-align:center; padding:8px 0 4px; }
  .badge-big{
    width:180px; height:200px; margin:0 auto 14px;
    clip-path:polygon(50% 0%, 100% 22%, 100% 62%, 50% 100%, 0% 62%, 0% 22%);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    animation:floatY 3.2s ease-in-out infinite;
  }
  @keyframes floatY{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
  .badge-big .badge-letter{ font-size:56px; font-weight:600; color:var(--gray90); }

  .tier-name{ font-size:28px; font-weight:600; line-height:1.3; margin-top:4px; color:var(--gray90); }
  .tier-sub{ font-size:14px; line-height:1.7; color:var(--gray70); margin-top:4px; font-weight:400; }
  .tier-pct{
    display:inline-block; margin-top:12px; padding:6px 14px; border-radius:var(--radius-btn);
    background:var(--gray10); font-size:20px; line-height:1.45; font-weight:600; color:var(--gray70);
  }

  .result-card{
    background:var(--white); border-radius:var(--radius-card); padding:18px;
    box-shadow:var(--shadow-card);
  }
  .result-card h3{ font-size:13px; line-height:1.5; color:var(--gray70); font-weight:600; margin-bottom:8px; letter-spacing:.02em; }
  .result-card p{ font-size:14px; line-height:1.7; color:var(--gray90); font-weight:400; }

  .promo-card{
    background:var(--primary10); border:1px solid var(--primary50);
  }
  .promo-card h3{ color:var(--gray90); }

  .share-row{ display:flex; gap:10px; }
  .share-row .btn{ flex:1; }

  .optin-card{ display:flex; flex-direction:column; gap:10px; }
  .optin-card h3{ color:var(--gray90); font-size:13px; line-height:1.5; font-weight:600; }
  .optin-row{ display:flex; gap:8px; }
  .optin-row input[type=email]{
    flex:1; background:var(--gray10); border:1.5px solid transparent; border-radius:var(--radius-input);
    padding:12px 14px; color:var(--gray90); font-size:14px; font-family:inherit;
  }
  .optin-row input[type=email]::placeholder{ color:var(--gray50); }
  .optin-row input[type=email]:focus{ outline:none; border-color:var(--primary); }
  .optin-row .btn{ width:auto; padding:12px 16px; }
  .optin-status{ font-size:13px; line-height:1.5; color:var(--success); min-height:14px; }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:var(--white); color:var(--gray90); box-shadow:var(--shadow-strong);
    padding:10px 18px; border-radius:var(--radius-btn); font-size:13px; line-height:1.5; font-weight:600;
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
    z-index:50; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  footer{ margin-top:28px; text-align:center; }
  footer small{ display:block; }

  .visually-hidden{
    position:absolute !important; width:1px; height:1px; overflow:hidden;
    clip:rect(0 0 0 0); white-space:nowrap;
  }

  /* ---------- tier color classes (다크·네온·글로우·그라디언트 제거 → 태그 팔레트 라이트 톤으로 재매핑) ---------- */
  .t-iron      { background:var(--tag-gray-light);   border:1.5px solid var(--tag-gray); }
  .t-silver    { background:var(--gray10);            border:1.5px solid var(--gray50); }
  .t-gold      { background:var(--tag-yellow-light);  border:1.5px solid var(--tag-yellow); }
  .t-platinum  { background:var(--tag-mint-light);    border:1.5px solid var(--tag-mint); }
  .t-diamond   { background:var(--tag-blue-light);    border:1.5px solid var(--tag-blue); }
  .t-master    { background:var(--tag-purple-light);  border:1.5px solid var(--tag-purple); }
  .t-challenger{ background:var(--tag-orange-light);  border:1.5px solid var(--tag-orange); box-shadow:var(--shadow-weak); }

  /* ---------- hub return link (ghost) ---------- */
  .hub-link-wrap{ margin-top:6px; text-align:center; }
  .hub-link{
    display:inline-block; font-size:13px; line-height:1.4; font-weight:600; color:var(--gray60);
    padding:12px 22px; border-radius:var(--radius-btn);
    background:transparent;
    transition:opacity .12s ease;
  }
  .hub-link:active{ opacity:.6; }

  @media (min-width:520px){
    #app{ padding-top:48px; }
    .badge-big{ width:200px; height:224px; }
  }
</style>
</head>
<body>

<div id="app">

  <!-- ============ INTRO ============ -->
  <section id="screen-intro" class="screen active">
    <div class="intro-hero">
      <span class="eyebrow">파충류 집사 전용</span>
      <h1>당신의 사육 기록력은<br>무슨 티어?</h1>
      <p>8문항, 60초. 아이언부터 챌린저까지 — 지금 당신의 기록 습관을 측정합니다.</p>
    </div>

    <div class="tier-preview" aria-hidden="true">
      <!-- 티어 프리뷰는 렌더 시 JS로 채워짐 -->
    </div>

    <button class="btn btn-primary" id="btn-start" type="button">티어 측정 시작하기</button>

    <div class="intro-note">
      <small>응답은 익명으로 통계에만 활용됩니다.</small>
      <small>이름·개인정보를 묻지 않습니다. 결과는 즉시 표시됩니다.</small>
    </div>
  </section>

  <!-- ============ QUIZ ============ -->
  <section id="screen-quiz" class="screen">
    <div class="progress-wrap">
      <button class="quiz-back-chevron" id="btn-back" type="button" aria-label="이전으로">‹</button>
      <div class="segments" id="segments"></div>
    </div>

    <div class="q-card" id="q-card">
      <!-- JS가 문항을 렌더 -->
    </div>

    <div class="quiz-cta">
      <div class="quiz-cta-inner">
        <button class="btn btn-primary" id="btn-quiz-next" type="button" disabled>다음</button>
      </div>
    </div>
  </section>

  <!-- ============ LOADING ============ -->
  <section id="screen-loading" class="screen">
    <div class="spinner"></div>
    <div class="loading-text">전적 검색 중<span class="loading-dots"></span></div>
    <p>당신의 사육 기록 데이터베이스를 분석하고 있습니다.</p>
  </section>

  <!-- ============ RESULT ============ -->
  <section id="screen-result" class="screen">
    <div class="result-hero">
      <div class="badge-big" id="badge-big"><span class="badge-letter" id="badge-letter">?</span></div>
      <div class="tier-name" id="tier-name">-</div>
      <div class="tier-sub" id="tier-sub">-</div>
      <div class="tier-pct" id="tier-pct">상위 -%</div>
    </div>

    <div class="result-card">
      <h3>티어 설명</h3>
      <p id="tier-desc">-</p>
    </div>

    <div class="result-card promo-card">
      <h3>승급 조건</h3>
      <p id="promo-text">-</p>
    </div>

    <div class="share-row">
      <button class="btn btn-primary" id="btn-share" type="button">결과 공유하기</button>
    </div>

    <div class="result-card optin-card">
      <h3>챌린저 가는 최단 루트 만드는 중</h3>
      <p style="font-size:13px;">기록 앱 출시 소식을 가장 먼저 받아보세요. (선택)</p>
      <form id="form-optin" name="test-c-optin" method="POST">
        <div class="optin-row">
          <input type="email" name="email" id="optin-email" placeholder="you@email.com" autocomplete="email">
          <button class="btn btn-ghost" type="submit">알림 받기</button>
        </div>
        <div class="optin-status" id="optin-status"></div>
      </form>
    </div>

    <button class="btn btn-ghost" id="btn-retry" type="button">다시하기</button>

    <div class="hub-link-wrap">
      <a class="hub-link" href="./">🦎 다른 테스트도 해보기</a>
    </div>
  </section>

</div>

<div class="toast" id="toast"></div>

<script>
var SUBMIT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxzA7PSYbFaOcaP1UCI1OlA0tYNj7WiFU5l0b1yjbjG7R1aIqI261lqChI0tdFluu3J/exec';
var PID_KEY = 'herptrack_pid';
var SUBMITTED_KEY = 'submitted_test-c';

function getPid(){
  var pid = localStorage.getItem(PID_KEY);
  if(!pid){
    pid = (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2));
    localStorage.setItem(PID_KEY, pid);
  }
  return pid;
}

/* ==========================================================================
   QUESTION_SCHEMA
   --------------------------------------------------------------------------
   pid  참여자 고유 식별자 (localStorage herptrack_pid, 테스트 a/b/c 공통 공유)
   q1 기록 도구      (현재 기록 방법)     app4 / excel3 / paper2 / kakao1 / memory0
   q2 기록 빈도      (급여 루틴 규칙성)   feed4 / weekly3 / whenever1 / never0
   q3 백업 여부                          auto4 / sometimes2 / device1 / none0
   q4 데이터 손실 경험                   none3 / partial2 / lost1 / no_records0
   q5 기록 범위                          all4 / feed_shed2 / feed_only1 / none0
   q6 개체 수·다종 여부                  multi_many4 / multi_few3 / single_multi2 / single_one1
   q7 사육 연차                          over5-4 / y3_5-3 / y1_3-2 / under1-1
   q8 WTP (기록 도구 지불 의향)          subscription2 / w30000-1 / w10000-1 / free0
        ※ q8은 티어 점수 기여를 의도적으로 낮게 설계(max 2, 타 문항 대비 최저 가중치).
          목적은 과금 유도가 아니라 WTP 분포 수집.

   TIER = f(sum(q1..q8 scores)), max score = 29, 7개 구간(아이언~챌린저).
   "상위 N%"는 실시간 서버 집계가 아니라 사전 정의된 고정 분포표(TIERS[].pct)이며,
   런칭 전까지 실제 응답 분포로 대체 예정. 참여자에게 실시간 집계로 오인되지 않도록
   결과 화면 문구는 "티어" 판정에만 초점을 맞추고 별도 "실시간" 표기를 하지 않음.

   제출: 결과 화면 진입 시 test-c-responses 폼으로 익명 자동 제출(fetch POST).
        이메일 옵트인은 별도 test-c-optin 폼으로 사용자가 명시 제출할 때만 전송.
   ========================================================================== */

  var QUESTIONS = [
    {
      id: 'q1', tag: 'Q1 · 기록 도구', title: '너의 메인 웨폰은?', sub: '사육 기록, 지금 뭘로 남기세요?',
      options: [
        { code:'app',    label:'전용 앱 / 자동 기록 시스템', score:4 },
        { code:'excel',  label:'엑셀 · 구글시트',            score:3 },
        { code:'paper',  label:'종이 다이어리',               score:2 },
        { code:'kakao',  label:'카톡 나에게 보내기',          score:1 },
        { code:'memory', label:'기억력이 곧 데이터베이스',    score:0 }
      ]
    },
    {
      id: 'q2', tag: 'Q2 · 기록 빈도', title: '업데이트 주기는?', sub: '급여 기록, 얼마나 자주 남기세요?',
      options: [
        { code:'feed',     label:'급여할 때마다 바로', score:4 },
        { code:'weekly',   label:'주 1회 정도 몰아서', score:3 },
        { code:'whenever', label:'생각날 때만',        score:1 },
        { code:'never',    label:'안 함',              score:0 }
      ]
    },
    {
      id: 'q3', tag: 'Q3 · 백업', title: '서버는 안전한가?', sub: '기록 데이터, 백업은 하고 계신가요?',
      options: [
        { code:'auto',      label:'클라우드 자동 백업',        score:4 },
        { code:'sometimes', label:'가끔 내보내기 / 사진 백업',  score:2 },
        { code:'device',    label:'기기 안에만 저장',           score:1 },
        { code:'none',      label:'백업이 뭐죠',                score:0 }
      ]
    },
    {
      id: 'q4', tag: 'Q4 · 손실 경험', title: '리셋 당한 적 있나?', sub: '기록이 사라진 경험, 있으신가요?',
      options: [
        { code:'none',       label:'없음, 다 살아있음',                   score:3 },
        { code:'partial',    label:'있었지만 일부 복구함',                score:2 },
        { code:'lost',       label:'있었고 복구 못 함',                    score:1 },
        { code:'no_records', label:'애초에 기록이 없어서 잃을 것도 없음', score:0 }
      ]
    },
    {
      id: 'q5', tag: 'Q5 · 기록 범위', title: '스탯 창엔 뭐가 있나?', sub: '기록하는 항목, 어디까지인가요?',
      options: [
        { code:'all',        label:'급여·탈피·체중·병력까지 전부', score:4 },
        { code:'feed_shed',  label:'급여 + 탈피 정도',              score:2 },
        { code:'feed_only',  label:'급여만',                        score:1 },
        { code:'none',       label:'기록 없음',                     score:0 }
      ]
    },
    {
      id: 'q6', tag: 'Q6 · 파티 구성', title: '파티 구성은?', sub: '개체 수와 다종 여부를 알려주세요.',
      options: [
        { code:'multi_many',   label:'다종 다수 (핵인분)',   score:4 },
        { code:'multi_few',    label:'다종 소수',             score:3 },
        { code:'single_multi', label:'동종 여러 마리',        score:2 },
        { code:'single_one',   label:'1마리 솔로 플레이',      score:1 }
      ]
    },
    {
      id: 'q7', tag: 'Q7 · 플레이 시간', title: '플레이 시간(연차)은?', sub: '사육을 시작한 지 얼마나 되셨나요?',
      options: [
        { code:'over5', label:'5년 이상', score:4 },
        { code:'y3_5',  label:'3~5년',    score:3 },
        { code:'y1_3',  label:'1~3년',    score:2 },
        { code:'under1',label:'1년 미만', score:1 }
      ]
    },
    {
      id: 'q8', tag: 'Q8 · 아이템 구매', title: '과금 의향은?', sub: '기록 도구에 낼 수 있는 최대 금액은?',
      options: [
        { code:'subscription', label:'구독도 OK (월 결제 가능)', score:2 },
        { code:'w30000',       label:'~₩30,000 일회성',          score:1 },
        { code:'w10000',       label:'~₩10,000 일회성',          score:1 },
        { code:'free',         label:'무료만',                    score:0 }
      ]
    }
  ];

  var TIERS = [
    { key:'iron',       name:'아이언',   min:0,  cls:'t-iron',       letter:'Fe',
      sub:'감으로 크는 사육사',
      desc:'기록이 없어도 애정은 진심. 다만 애가 며칠 전에 뭘 먹었는지는 아무도 모른다. 아이언이어도 우리 애는 행복할 수 있음. 근데 기록은 하자.',
      pct:'상위 89%' },
    { key:'silver',     name:'실버',     min:4,  cls:'t-silver',     letter:'Ag',
      sub:'가끔 기록하는 집사',
      desc:'생각날 때 한 번씩 남기는 타입. 급여 텀이 살짝 헷갈릴 때가 있다면 지금이 습관을 붙일 타이밍.',
      pct:'상위 68%' },
    { key:'gold',       name:'골드',     min:9,  cls:'t-gold',       letter:'Au',
      sub:'성실한 급여 기록러',
      desc:'꾸준히 남기는 편. 백업이나 기록 범위 중 한 군데만 다듬으면 상위권 진입.',
      pct:'상위 45%' },
    { key:'platinum',   name:'플래티넘', min:14, cls:'t-platinum',   letter:'Pt',
      sub:'체계 잡힌 브리더 지망생',
      desc:'급여·탈피까지 챙기는 수준급 관리자. 여기서부턴 데이터가 곧 사육 실력이다.',
      pct:'상위 24%' },
    { key:'diamond',    name:'다이아',   min:19, cls:'t-diamond',    letter:'Dia',
      sub:'데이터 기반 사육자',
      desc:'백업·범위·빈도 모두 상위권. 어지간한 파충류샵보다 기록이 체계적이다.',
      pct:'상위 11%' },
    { key:'master',     name:'마스터',   min:23, cls:'t-master',     letter:'M',
      sub:'기록의 신',
      desc:'전 항목 만점에 가까운 관리력. 이 정도면 남의 개체 기록도 대신 짜줄 수 있는 레벨.',
      pct:'상위 4%' },
    { key:'challenger',  name:'챌린저',  min:27, cls:'t-challenger', letter:'C',
      sub:'종합병원급 사육 기록',
      desc:'급여, 탈피, 체중, 백업까지 완벽. 이 정도면 파충류샵 차려도 됨.',
      pct:'상위 1%' }
  ];

  // 승급 조건 산정에 쓰이는 "행동 가능한" 축만 포함(q6 개체구성·q7 연차는 즉시 바꿀 수 없어 제외)
  var ACTIONABLE_AXES = ['q1','q2','q3','q4','q5'];
  var AXIS_MAX = { q1:4, q2:4, q3:4, q4:3, q5:4 };
  var PROMOTION_TIPS = {
    q1: '기록 도구부터 바꿔보자 — 카톡 나에게 보내기만 시작해도 한 티어 오른다.',
    q2: '급여할 때마다 한 줄만 남겨도 승급권 진입.',
    q3: '백업만 켜도 승급 — 자동 백업 앱 하나면 실버 → 골드.',
    q4: '복구 불가 경험이 있다면 지금 바로 백업부터. 다음 손실은 막을 수 있다.',
    q5: '급여만 기록 중이라면 탈피 기록만 추가해도 승급.'
  };
  var MAX_TOTAL_SCORE = 29;

  // ---- state ----
  var state = { index:0, answers:{} };

  // ---- elements ----
  var el = {
    intro: document.getElementById('screen-intro'),
    quiz: document.getElementById('screen-quiz'),
    loading: document.getElementById('screen-loading'),
    result: document.getElementById('screen-result'),
    tierPreview: document.querySelector('.tier-preview'),
    segments: document.getElementById('segments'),
    qCard: document.getElementById('q-card'),
    btnStart: document.getElementById('btn-start'),
    btnBack: document.getElementById('btn-back'),
    btnQuizNext: document.getElementById('btn-quiz-next'),
    btnRetry: document.getElementById('btn-retry'),
    btnShare: document.getElementById('btn-share'),
    badgeBig: document.getElementById('badge-big'),
    badgeLetter: document.getElementById('badge-letter'),
    tierName: document.getElementById('tier-name'),
    tierSub: document.getElementById('tier-sub'),
    tierPct: document.getElementById('tier-pct'),
    tierDesc: document.getElementById('tier-desc'),
    promoText: document.getElementById('promo-text'),
    formOptin: document.getElementById('form-optin'),
    optinStatus: document.getElementById('optin-status'),
    toast: document.getElementById('toast')
  };

  function showScreen(name){
    [el.intro, el.quiz, el.loading, el.result].forEach(function(s){ s.classList.remove('active'); });
    var map = { intro: el.intro, quiz: el.quiz, loading: el.loading, result: el.result };
    map[name].classList.add('active');
  }

  function renderTierPreview(){
    el.tierPreview.innerHTML = '';
    TIERS.forEach(function(t, i){
      var item = document.createElement('div');
      item.className = 'tier-preview-item';
      item.innerHTML = '<div class="mini-badge ' + t.cls + '"></div><small>' + t.name + '</small>';
      el.tierPreview.appendChild(item);
      if(i < TIERS.length - 1){
        var arrow = document.createElement('div');
        arrow.className = 'tier-preview-arrow';
        arrow.textContent = '→';
        el.tierPreview.appendChild(arrow);
      }
    });
  }

  var pendingPick = null;

  function renderSegments(){
    el.segments.innerHTML = '';
    QUESTIONS.forEach(function(_, i){
      var seg = document.createElement('div');
      seg.className = 'segment' + (i <= state.index ? ' filled' : '');
      el.segments.appendChild(seg);
    });
  }

  function renderQuestion(){
    var q = QUESTIONS[state.index];
    pendingPick = state.answers[q.id] || null;

    renderSegments();

    var html = '';
    html += '<div class="q-head">';
    html += '<div class="q-tag">' + q.tag + '</div>';
    html += '<div class="q-title">' + q.title + '</div>';
    html += '<div class="q-sub">' + q.sub + '</div>';
    html += '</div>';
    html += '<div class="options" role="listbox">';
    q.options.forEach(function(opt){
      var sel = pendingPick === opt.code ? ' selected' : '';
      html += '<button type="button" class="option' + sel + '" data-code="' + opt.code + '">' + opt.label + '</button>';
    });
    html += '</div>';
    el.qCard.innerHTML = html;

    el.qCard.querySelectorAll('.option').forEach(function(btn){
      btn.addEventListener('click', function(){ onPick(btn.dataset.code); });
    });

    updateNextButton();
  }

  function onPick(code){
    pendingPick = code;
    el.qCard.querySelectorAll('.option').forEach(function(btn){
      btn.classList.toggle('selected', btn.dataset.code === code);
    });
    updateNextButton();
  }

  function updateNextButton(){
    el.btnQuizNext.disabled = !pendingPick;
  }

  function goNext(){
    if(!pendingPick) return;
    var q = QUESTIONS[state.index];
    state.answers[q.id] = pendingPick;
    if(state.index < QUESTIONS.length - 1){
      state.index += 1;
      renderQuestion();
    } else {
      finishQuiz();
    }
  }

  el.btnBack.addEventListener('click', function(){
    if(state.index > 0){
      state.index -= 1;
      renderQuestion();
    } else {
      showScreen('intro');
    }
  });

  el.btnQuizNext.addEventListener('click', goNext);

  function scoreOf(qId, code){
    var q = QUESTIONS.filter(function(x){ return x.id === qId; })[0];
    var opt = q.options.filter(function(o){ return o.code === code; })[0];
    return opt ? opt.score : 0;
  }

  function computeTotal(){
    var total = 0;
    QUESTIONS.forEach(function(q){
      total += scoreOf(q.id, state.answers[q.id]);
    });
    return total;
  }

  function computeTier(total){
    var picked = TIERS[0];
    TIERS.forEach(function(t){
      if(total >= t.min) picked = t;
    });
    return picked;
  }

  function computeWeakestAxis(){
    var minRatio = 2; // >1 sentinel
    var weakest = ACTIONABLE_AXES[0];
    ACTIONABLE_AXES.forEach(function(qId){
      var s = scoreOf(qId, state.answers[qId]);
      var ratio = s / AXIS_MAX[qId];
      if(ratio < minRatio){
        minRatio = ratio;
        weakest = qId;
      }
    });
    return { axis: weakest, ratio: minRatio };
  }

  function finishQuiz(){
    showScreen('loading');
    setTimeout(function(){
      var total = computeTotal();
      var tier = computeTier(total);
      renderResult(tier, total);
      submitResponses(tier, total);
      showScreen('result');
    }, 1600);
  }

  function renderResult(tier, total){
    el.badgeBig.className = 'badge-big ' + tier.cls;
    el.badgeLetter.textContent = tier.letter;
    el.tierName.textContent = tier.name;
    el.tierSub.textContent = tier.sub;
    el.tierPct.textContent = tier.pct + ' 사육자';
    el.tierDesc.textContent = tier.desc;

    var weakest = computeWeakestAxis();
    if(tier.key === 'challenger' || weakest.ratio >= 1){
      el.promoText.textContent = '이미 최고 티어 근처. 지금 루틴만 유지해도 챌린저 유지권.';
    } else {
      el.promoText.textContent = PROMOTION_TIPS[weakest.axis];
    }

    state._lastTier = tier;
    state._lastTotal = total;
  }

  function showToast(msg){
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    setTimeout(function(){ el.toast.classList.remove('show'); }, 1800);
  }

  el.btnShare.addEventListener('click', function(){
    var tier = state._lastTier;
    var url = location.origin + location.pathname;
    var text = '나 기록력 ' + (tier ? tier.name : '') + ' 집사임. 너는? ' + url;
    copyToClipboard(text);
  });

  function copyToClipboard(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        showToast('복사됨! 친구에게 붙여넣기 하세요');
      }).catch(function(){ fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try{
      document.execCommand('copy');
      showToast('복사됨! 친구에게 붙여넣기 하세요');
    }catch(e){
      showToast('복사 실패 — 직접 선택해서 복사해주세요');
    }
    document.body.removeChild(ta);
  }

  el.btnRetry.addEventListener('click', function(){
    state = { index:0, answers:{} };
    el.optinStatus.textContent = '';
    el.formOptin.reset();
    showScreen('intro');
  });

  el.btnStart.addEventListener('click', function(){
    state = { index:0, answers:{} };
    showScreen('quiz');
    renderQuestion();
  });

  // ---- 데이터 제출 (Google Apps Script 엔드포인트, fire-and-forget) ----
  function submitPayload(formName, data){
    var payload = Object.assign({ form: formName }, data);
    return fetch(SUBMIT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
  }

  function submitResponses(tier, total){
    var payload = {};
    QUESTIONS.forEach(function(q){ payload[q.id] = state.answers[q.id] || ''; });
    payload.tier = tier.key;
    payload.score = String(total);
    payload.pid = getPid();

    if(localStorage.getItem(SUBMITTED_KEY)) return;

    submitPayload('test-c-responses', payload).catch(function(err){
      // 데모/오프라인 환경에서는 엔드포인트가 없을 수 있음 — UX를 막지 않고 조용히 무시
      console.debug('test-c-responses submit skipped:', err && err.message);
    });
    localStorage.setItem(SUBMITTED_KEY, '1');
  }

  el.formOptin.addEventListener('submit', function(ev){
    ev.preventDefault();
    var emailInput = document.getElementById('optin-email');
    var email = emailInput.value.trim();
    if(!email){
      el.optinStatus.textContent = '이메일을 입력해주세요.';
      return;
    }
    submitPayload('test-c-optin', { email: email, pid: getPid() })
      .then(function(){ el.optinStatus.textContent = '등록 완료 — 소식 받으실 때 알려드릴게요.'; })
      .catch(function(err){
        el.optinStatus.textContent = '등록 완료 — 소식 받으실 때 알려드릴게요.';
        console.debug('test-c-optin submit skipped:', err && err.message);
      });
    emailInput.value = '';
  });

  // ---- init ----
  renderTierPreview();
</script>
